<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feriwala Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main class="shell"><header><a href="/" class="brand">Feri<span>wala</span> <small>ADMIN</small></a><a href="/" target="_blank">দোকান দেখুন ↗</a></header><section id="loginPanel" class="panel login"><h1>Admin Login</h1><p>এই প্যানেল শুধু দোকান পরিচালনার জন্য।</p><form id="loginForm"><label>ইউজারনেম<input name="username" autocomplete="username" required></label><label>পাসওয়ার্ড<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">লগইন</button><p id="loginError" class="error"></p></form></section><section id="dashboard" hidden><div class="dashhead"><div><h1>দোকান পরিচালনা</h1><p>প্রোডাক্ট, স্টক ও কাস্টমার অর্ডার ম্যানেজ করুন।</p></div><button id="logout" class="outline">লগআউট</button></div><div class="tabs"><button class="tab active" data-tab="productsTab">প্রোডাক্ট ম্যানেজমেন্ট</button><button class="tab" data-tab="ordersTab">অর্ডার ম্যানেজমেন্ট</button><button class="tab" data-tab="offersTab">অফার ম্যানেজমেন্ট</button></div><section id="productsTab" class="panel"><div class="sectionhead"><h2>প্রোডাক্ট</h2><button id="addProduct" class="primary">＋ নতুন প্রোডাক্ট</button></div><div id="productFormWrap" hidden><form id="productForm" class="productform"><input type="hidden" name="id"><label>প্রোডাক্টের নাম<input name="name" required maxlength="120"></label><label>ক্যাটাগরি<input name="category" required placeholder="ঘড়ি / আতর / গিফট"></label><label>বিক্রয়মূল্য (৳)<input name="price" type="number" min="0" required></label><label>আগের মূল্য (৳)<input name="oldPrice" type="number" min="0" value="0"></label><label>ইমোজি<input name="emoji" maxlength="12" value="🎁"></label><label>প্রোডাক্ট ছবি<input name="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><label>ব্যাজ/লেবেল<input name="label" maxlength="40" placeholder="NEW / SALE"></label><label>স্টক<input name="stock" type="number" min="0" value="0" required></label><label>বিবরণ<input name="description" maxlength="300"></label><label class="check"><input name="active" type="checkbox" checked> কাস্টমারের কাছে দেখাবে</label><div class="formactions"><button class="primary">সংরক্ষণ করুন</button><button type="button" id="cancelEdit" class="outline">বাতিল</button></div><p id="formError" class="error"></p></form></div><div id="productsTable" class="tablewrap">লোড হচ্ছে…</div></section><section id="ordersTab" class="panel" hidden><div class="sectionhead"><h2>কাস্টমার অর্ডার</h2><button id="refreshOrders" class="outline">↻ রিফ্রেশ</button></div><div id="ordersTable" class="tablewrap">লোড হচ্ছে…</div></section><section id="offersTab" class="panel" hidden><div class="sectionhead"><h2>কাস্টমার অফার</h2></div><form id="offerForm" class="productform"><label>অফার শিরোনাম<input name="text" maxlength="500" required placeholder="যেমন: কাপল ঘড়িতে বিশেষ ছাড়"></label><label>অফারের প্রোডাক্ট<select name="productId" id="offerProduct" required><option value="">প্রোডাক্ট বাছাই করুন</option></select></label><label>অফার মূল্য (৳)<input name="price" type="number" min="0" value="0" required></label><label>আগের মূল্য (৳)<input name="oldPrice" type="number" min="0" value="0"></label><label>অফারের ছবি (ঐচ্ছিক)<input name="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><label>বিবরণ<input name="description" maxlength="300" placeholder="অফারের সংক্ষিপ্ত বিবরণ"></label><div class="formactions"><button class="primary">＋ অফার প্রোডাক্ট যোগ করুন</button></div></form><div id="offersList" class="tablewrap"></div></section><p id="message" class="message" role="status"></p></section><footer>Feriwala Admin · নিরাপদে লগআউট করুন, বিশেষ করে শেয়ার করা কম্পিউটারে।</footer></main><script src="/admin/admin.js" defer></script></body></html>
